[platformio]
default_envs = featheresp32v2

[env:featheresp32v2]
platform = espressif32@6.13.0
board = adafruit_feather_esp32_v2
framework = arduino
extra_scripts = pre:tools/provision_device_id.py
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_manti.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
lib_deps =
  ; sparkfun/SparkFun Spectral Triad AS7265X  ; Using local patched version in lib/
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
